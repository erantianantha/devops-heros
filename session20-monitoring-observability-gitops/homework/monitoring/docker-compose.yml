# Monitoring demo: Prometheus scrapes itself + Grafana, evaluates alert rules; Grafana visualises.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: hw20-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
  grafana:
    image: grafana/grafana:12.1.1
    container_name: hw20-grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    depends_on: [prometheus]
