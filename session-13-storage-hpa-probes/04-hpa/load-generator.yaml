# Same loop as `kubectl run load-generator --image=busybox:1.36 ...` from readme1.md,
# but as a Deployment so the load can be raised with `kubectl scale`.
#
# It targets $HPA_DEMO_SERVICE_SERVICE_HOST (the Service ClusterIP that kubelet injects
# as an env var) instead of the DNS name. Resolving the name on every request was the
# bottleneck: ~3.6x fewer requests and intermittent "wget: bad address" errors, so adding
# generators did not add load. The env var only exists if the Service was created first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O- http://$HPA_DEMO_SERVICE_SERVICE_HOST > /dev/null; done"
